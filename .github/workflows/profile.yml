name: Refresh profile data

on:
  workflow_dispatch:
  schedule:
    - cron: '38 2 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'config/**'
      - 'design/**'
      - 'data/projects.json'
      - 'data/spoken-languages.json'
      - 'assets/mascot-cat.svg'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-writes
  queue: max
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check counting rules
        run: python -m unittest discover -s tests -v
      - name: Read public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_github.py
      - name: Build the scene and contribution art
        run: |
          python tools/build_scene.py
          python tools/update_contributions.py
          python tools/build_profile.py
      - name: Save generated profile
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data docs/projects
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh profile activity and contribution art'
          git push origin "HEAD:$DEFAULT_BRANCH"
