<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 96 96" role="img" aria-labelledby="cat-title cat-description">
  <title id="cat-title">John's orange tabby cat</title>
  <desc id="cat-description">A simple geometric cat based on John's pet: orange fur, pink ears, round eyes, a few tabby stripes and a pale muzzle and chest.</desc>
  <g id="cat-art" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body, tail and ears use the same few shapes as the original frog. -->
    <path d="M65 76H81V62" fill="none" stroke="#DDA56D" stroke-width="10"/>
    <rect x="25" y="55" width="40" height="29" rx="5" fill="#DDA56D"/>
    <rect x="36" y="60" width="18" height="21" rx="3" fill="#F4DFBD"/>
    <rect x="23" y="79" width="20" height="8" rx="2" fill="#DDA56D"/>
    <rect x="49" y="79" width="20" height="8" rx="2" fill="#DDA56D"/>
    <path d="M15 31V10L36 27M75 31V10L54 27" fill="#DDA56D"/>
    <path d="M20 27V19L29 27M70 27V19L61 27" fill="#D89D96"/>
    <rect x="15" y="25" width="60" height="39" rx="6" fill="#DDA56D"/>

    <!-- A few markings keep the orange tabby recognisable at small sizes. -->
    <path d="M34 27V32M45 27V35M56 27V32M18 48H23M67 48H72M27 69H31M59 69H63" fill="none" stroke="#B57B4D" stroke-width="3"/>
    <rect x="31" y="48" width="28" height="13" rx="5" fill="#F4DFBD"/>
    <circle cx="31" cy="42" r="6" fill="#46382E"/>
    <circle cx="59" cy="42" r="6" fill="#46382E"/>
    <circle cx="29" cy="40" r="1.5" fill="#FFF6E7"/>
    <circle cx="57" cy="40" r="1.5" fill="#FFF6E7"/>
    <path d="M41 49H49L45 53Z" fill="#D89D96"/>
    <path d="M45 53V56M41 57L45 56L49 57" fill="none" stroke="#775444" stroke-width="1.5"/>
  </g>
</svg>
