name: Refresh music snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  music:
    if: vars.MUSIC_PROVIDER == 'spotify' || vars.MUSIC_PROVIDER == 'lastfm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the connected music source
        env:
          MUSIC_PROVIDER: ${{ vars.MUSIC_PROVIDER }}
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_USERNAME: ${{ vars.LASTFM_USERNAME }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          python tools/update_music.py
          python tools/build_profile.py
      - name: Save the listening snapshot
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data/music.json docs/projects
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh listening snapshot'
          git push origin "HEAD:$DEFAULT_BRANCH"
